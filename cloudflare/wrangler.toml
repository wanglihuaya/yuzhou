name = "yuzhou-dev"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

# The upstream origin is intentionally not committed. After the first deploy:
#   npx wrangler secret put ORIGIN
# Local development: ORIGIN="https://…" in .dev.vars (gitignored).

# The xiaoyuzhoufm.dev zone must be active in the same Cloudflare account.
# Custom domains get DNS records and certificates managed automatically.
routes = [
  { pattern = "www.xiaoyuzhoufm.dev", custom_domain = true },
  { pattern = "xiaoyuzhoufm.dev", custom_domain = true },
]
